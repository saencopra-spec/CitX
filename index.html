<!doctype html>
<html lang="es-CR" data-tema="claro" data-texto="normal">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#04AFA8" />
    <meta
      name="description"
      content="CitX es la aplicación del Complejo Educativo CIT: mapa interactivo del campus, guía digital con eventos y horarios, y pedidos en la soda Armonía."
    />
    <title>CitX - Complejo Educativo CIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Delius&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Pantalla de carga: va aqui, sin JavaScript, para que se vea al instante. -->
    <style>
      #carga {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            40rem 30rem at 50% 38%,
            rgba(99, 209, 180, 0.16),
            transparent 70%
          ),
          #0e1832;
        color: #ffffff;
        transition:
          opacity 520ms cubic-bezier(0.23, 1, 0.32, 1),
          visibility 0s linear 520ms;
      }
      #carga.es-salida {
        opacity: 0;
        visibility: hidden;
      }
      #carga.es-salida .carga__centro {
        transform: scale(1.06);
        filter: blur(4px);
      }
      .carga__centro {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        transition:
          transform 520ms cubic-bezier(0.23, 1, 0.32, 1),
          filter 520ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      .carga__bombilla {
        width: auto;
        height: 112px;
        overflow: visible;
      }
      .carga__bombilla [data-trazo] {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: carga-trazo 1.1s cubic-bezier(0.77, 0, 0.175, 1) forwards;
      }
      .carga__bombilla [data-trazo]:nth-child(2) {
        animation-delay: 0.12s;
      }
      .carga__bombilla [data-trazo]:nth-child(3) {
        animation-delay: 0.3s;
      }
      .carga__bombilla [data-base] {
        opacity: 0;
        transform: translateY(6px);
        animation: carga-sube 0.6s cubic-bezier(0.23, 1, 0.32, 1) 0.7s forwards;
      }
      .carga__luz {
        opacity: 0;
        animation: carga-luz 2.4s ease-in-out 1s infinite;
      }
      .carga__nombre {
        font:
          800 34px/1 'Figtree',
          system-ui,
          sans-serif;
        letter-spacing: 0.08em;
        opacity: 0;
        animation: carga-sube 0.6s cubic-bezier(0.23, 1, 0.32, 1) 0.85s forwards;
      }
      .carga__barra {
        position: relative;
        width: 120px;
        height: 3px;
        margin-top: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        opacity: 0;
        animation: carga-sube 0.5s ease 1s forwards;
      }
      .carga__barra::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #63d1b4, #5ab4dc, #436ddd);
        animation: carga-barra 1.1s cubic-bezier(0.77, 0, 0.175, 1) infinite;
      }
      @keyframes carga-trazo {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes carga-sube {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes carga-luz {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 0.55;
        }
      }
      @keyframes carga-barra {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #carga *,
        #carga *::after {
          animation-duration: 1ms !important;
          animation-delay: 0s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="carga" role="status" aria-label="Cargando CitX">
      <div class="carga__centro">
        <svg
          class="carga__bombilla"
          viewBox="13.6 1.4 63.2 76"
          aria-hidden="true"
        >
          <defs>
            <linearGradient
              id="carga-grad"
              gradientUnits="userSpaceOnUse"
              x1="22"
              y1="6"
              x2="62"
              y2="76"
            >
              <stop offset="0%" stop-color="#63D1B4" />
              <stop offset="45%" stop-color="#5AB4DC" />
              <stop offset="100%" stop-color="#436DDD" />
            </linearGradient>
            <radialGradient id="carga-halo">
              <stop offset="0%" stop-color="#63D1B4" stop-opacity="0.9" />
              <stop offset="100%" stop-color="#63D1B4" stop-opacity="0" />
            </radialGradient>
            <mask id="carga-rosca">
              <rect x="0" y="0" width="91" height="78" fill="#fff" />
              <g fill="#000" transform="rotate(-4 46 61)">
                <rect x="35.8" y="56.6" width="20.8" height="2.4" rx="1.2" />
                <rect
                  x="35.8"
                  y="62.6"
                  width="20.8"
                  height="2.4"
                  rx="1.2"
                  transform="rotate(-2 46 64)"
                />
              </g>
            </mask>
          </defs>
          <circle
            class="carga__luz"
            cx="45.2"
            cy="31"
            r="34"
            fill="url(#carga-halo)"
          />
          <g
            fill="none"
            stroke="url(#carga-grad)"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              data-trazo
              pathLength="1"
              stroke-width="8"
              d="M27.5 52.6 C24.5 47 18 42 18 33 A27.2 27.2 0 0 1 72.4 33 C72.4 42 66 47 63 52.6 Z"
            />
            <path
              data-trazo
              pathLength="1"
              stroke-width="5.8"
              d="M41.6 51.5 L36 42.3 A15 15 0 1 1 54.6 42.3 L50 51.5"
            />
            <path
              data-trazo
              pathLength="1"
              stroke-width="5.8"
              d="M40.6 31.5 L46 37.6 L56.6 26.4"
            />
          </g>
          <path
            data-base
            fill="url(#carga-grad)"
            mask="url(#carga-rosca)"
            d="M26.5 52 H65.5 L63.4 56 V65 Q63.4 69.5 58.5 70 L53.5 70.5 Q54 77 46.2 77 Q38.4 77 38.8 70.5 L33 70 Q28.2 69.5 28.2 65 V56 Z"
          />
        </svg>
        <span class="carga__nombre">CITX</span>
        <span class="carga__barra"></span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
